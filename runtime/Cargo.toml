[package]
name = "aegisrun-runtime"
version = "0.4.0"
edition = "2021"
description = "AegisRun - AI Agent Secure Tool Runtime (MoonBit + Rust)"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmtime = "39"
wasmtime-wasi = "39"

[[bin]]
name = "aegisrun"
path = "src/main.rs"
