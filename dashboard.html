<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AegisRun Admin Panel v0.3.1</title>
<style>
:root { --bg:#0d1117; --card:#161b22; --border:#30363d; --accent:#6c63ff; --green:#00cc88; --red:#ff4757; --yellow:#ffd700; --text:#c9d1d9; --dim:#8b949e }
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:20px;color:var(--accent)} header span{color:var(--dim);font-size:13px}
nav{background:var(--card);border-bottom:1px solid var(--border);padding:0 24px;display:flex;gap:4px}
nav button{background:none;border:none;color:var(--dim);padding:12px 20px;cursor:pointer;font-size:14px;border-bottom:2px solid transparent;transition:.2s}
nav button:hover,nav button.active{color:var(--text);border-bottom-color:var(--accent)}
main{max-width:1400px;margin:0 auto;padding:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px}
.card h3{font-size:15px;margin-bottom:16px;color:var(--accent)}
.card h3 .icon{margin-right:8px}
.stat{text-align:center;padding:12px 0}
.stat .num{font-size:36px;font-weight:700}
.stat .label{font-size:12px;color:var(--dim);margin-top:4px}
.green{color:var(--green)} .red{color:var(--red)} .yellow{color:var(--yellow)}
.row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.toggle{position:relative;width:44px;height:24px;display:inline-block}
.toggle input{opacity:0;width:0;height:0}
.toggle .slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:var(--border);border-radius:24px;transition:.3s}
.toggle .slider:before{content:"";position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:var(--text);border-radius:50%;transition:.3s}
.toggle input:checked+.slider{background:var(--accent)}
.toggle input:checked+.slider:before{transform:translateX(20px)}
input[type="text"],select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:6px;width:100%;font-size:13px;margin:4px 0 12px}
input:focus,select:focus{outline:none;border-color:var(--accent)}
.btn{padding:8px 20px;border-radius:6px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:.2s}
.btn-primary{background:var(--accent);color:white}
.btn-danger{background:var(--red);color:white}
.btn-green{background:var(--green);color:var(--bg)}
.btn:hover{opacity:.85}
.tag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:11px;margin:2px 4px 2px 0}
.tag-block{background:rgba(255,71,87,.15);color:var(--red)}
.tag-allow{background:rgba(0,204,136,.15);color:var(--green)}
.tag-preset{background:rgba(108,99,255,.15);color:var(--accent)}
.log-line{font-family:'Cascadia Code',monospace;font-size:12px;padding:4px 8px;border-left:3px solid var(--border);margin:4px 0;background:var(--bg);border-radius:0 4px 4px 0}
.log-block{border-left-color:var(--red)}
.log-allow{border-left-color:var(--green)}
.log-info{border-left-color:var(--accent)}
.progress-bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin:4px 0}
.progress-fill{height:100%;border-radius:4px;transition:width .5s}
.fill-green{background:var(--green)} .fill-yellow{background:var(--yellow)} .fill-red{background:var(--red)}
</style>
</head>
<body>

<header>
  <div><h1>AegisRun</h1><span>Admin Panel v0.3.1 · MoonBit + Rust</span></div>
  <div style="display:flex;gap:16px;align-items:center">
    <span id="status" style="color:var(--green);font-size:13px">● Active</span>
    <span style="color:var(--dim);font-size:12px">Policy: <strong id="preset-name">standard</strong></span>
  </div>
</header>

<nav>
  <button class="active" onclick="switchTab('dashboard')">仪表盘</button>
  <button onclick="switchTab('domains')">域名策略</button>
  <button onclick="switchTab('paths')">路径策略</button>
  <button onclick="switchTab('env')">环境变量</button>
  <button onclick="switchTab('tools')">工具管理</button>
  <button onclick="switchTab('audit')">审计日志</button>
</nav>

<main id="dashboard">
  <div class="grid">
    <div class="card">
      <h3>🛡️ 防御层状态</h3>
      <div id="defense-toggles"></div>
    </div>
    <div class="card">
      <h3>📊 实时统计</h3>
      <div class="grid" style="grid-template-columns:1fr 1fr">
        <div class="stat"><div class="num green" id="stat-allowed">0</div><div class="label">放行</div></div>
        <div class="stat"><div class="num red" id="stat-blocked">0</div><div class="label">拦截</div></div>
      </div>
      <div class="progress-bar"><div class="progress-fill fill-green" id="bar-allow" style="width:50%"></div></div>
      <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--dim)"><span>CPU 45%</span><span>MEM 62%</span><span>Slot 67/100</span></div>
    </div>
    <div class="card">
      <h3>⚡ 预设模板</h3>
      <select id="preset-select" onchange="applyPreset()">
        <option value="standard">Standard — 标准安全（推荐）</option>
        <option value="strict">Strict — 全拒，逐个审批</option>
        <option value="permissive">Permissive — 仅拦截关键路径</option>
        <option value="custom">Custom — 自定义策略</option>
      </select>
      <button class="btn btn-primary" onclick="applyPreset()" style="margin-top:8px;width:100%">应用预设</button>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn btn-green" onclick="exportPolicy()" style="flex:1">⬇ 导出 policy.yaml</button>
        <button class="btn" onclick="exportCLI()" style="flex:1;background:var(--border);color:var(--text)">📋 复制 CLI 命令</button>
      </div>
    </div>
  </div>
</main>

<main id="domains" style="display:none">
  <div class="grid">
    <div class="card">
      <h3>🚫 域名黑名单</h3>
      <div id="domain-blacklist"></div>
      <input type="text" id="new-domain-bl" placeholder="添加域名 (evil.com / 192.168.* / *.cn)">
      <button class="btn btn-danger" onclick="addItem('domain-bl')">添加黑名单</button>
    </div>
    <div class="card">
      <h3>✅ 域名白名单</h3>
      <div id="domain-whitelist"></div>
      <input type="text" id="new-domain-wl" placeholder="添加域名 (api.github.com)">
      <button class="btn btn-green" onclick="addItem('domain-wl')">添加白名单</button>
    </div>
    <div class="card">
      <h3>🌐 IP 黑名单</h3>
      <div id="ip-blacklist"></div>
      <input type="text" id="new-ip-bl" placeholder="IP 段 (5.45. / 185.130.)">
      <button class="btn btn-danger" onclick="addItem('ip-bl')">添加 IP 段</button>
    </div>
  </div>
</main>

<main id="paths" style="display:none">
  <div class="card">
    <h3>📁 路径黑名单</h3>
    <div id="path-blacklist"></div>
    <input type="text" id="new-path-bl" placeholder="路径 (/etc/passwd / ~/.ssh/ / C:\Windows\)">
    <button class="btn btn-danger" onclick="addItem('path-bl')">添加路径</button>
  </div>
</main>

<main id="env" style="display:none">
  <div class="card">
    <h3>🔑 敏感环境变量模式</h3>
    <div id="env-patterns"></div>
    <input type="text" id="new-env-pattern" placeholder="模式 (API_KEY / DATABASE_URL / GITHUB_TOKEN)">
    <button class="btn btn-danger" onclick="addItem('env-pattern')">添加模式</button>
  </div>
</main>

<main id="tools" style="display:none">
  <div class="grid">
    <div class="card">
      <h3>🔧 已注册工具</h3>
      <div id="tool-list"></div>
    </div>
    <div class="card">
      <h3>🚫 工具黑名单</h3>
      <div id="tool-blacklist"></div>
      <input type="text" id="new-tool-bl" placeholder="工具ID (weather-query)">
      <button class="btn btn-danger" onclick="addItem('tool-bl')">封杀工具</button>
    </div>
  </div>
</main>

<main id="audit" style="display:none">
  <div class="card">
    <h3>📋 审计日志</h3>
    <div id="audit-log"></div>
  </div>
</main>

<script>
// ═══════════ Policy State ═══════════
const defaultPolicy = {
  preset:'standard',
  defense:{layer1:true,layer2:true,layer3:true,layer4:true,layer5:false},
  domainBL:['evil.com','stealer.cc','192.168.*','10.*','172.16.*','127.0.0.1','localhost'],
  domainSuffix:['*.cn','*.ru','*.tk'],
  domainWL:['wttr.in','api.github.com'],
  ipBL:['5.45.','185.130.','194.26.','45.155.','91.121.','37.59.'],
  pathBL:['/etc/passwd','/etc/shadow','~/.ssh/','~/.aws/','C:\\Windows\\'],
  envPatterns:['AWS_SECRET','OPENAI_API_KEY','ANTHROPIC_API_KEY','DATABASE_URL','REDIS_URL','GITHUB_TOKEN','DOCKER_PASSWORD'],
  toolBL:[],
  tools:[{id:'calculator',desc:'Pure math, no network/FS',status:'active'},{id:'weather-query',desc:'Weather API tool',status:'active'},{id:'log-analyzer',desc:'Log analysis tool',status:'active'}],
  audit:[{time:'10:23:01',tool:'calculator',action:'install',result:'ALLOW',reason:'safe tool'},{time:'10:23:15',tool:'weather-query',action:'install',result:'ALLOW',reason:'risk=92'},{time:'10:25:33',tool:'weather-query',action:'execute',result:'DENY',reason:'evil.com BL'},{time:'10:25:34',tool:'weather-query',action:'execute',result:'DENY',reason:'.ru suffix'},{time:'10:30:00',tool:'weather-query',action:'ban',result:'DENY',reason:'suspicious'}]
};
let policy = JSON.parse(localStorage.getItem('aegisrun-policy')) || defaultPolicy;
function save(){ localStorage.setItem('aegisrun-policy',JSON.stringify(policy)); render(); }

// ═══════════ Render ═══════════
function render(){
  document.getElementById('preset-name').textContent = policy.preset;
  document.getElementById('preset-select').value = policy.preset;
  // Defense toggles
  const names = {layer1:'安装时声明审查',layer2:'域名/IP黑名单',layer3:'路径+环境变量保护',layer4:'工具黑名单+审计',layer5:'Wasm沙箱(wasmtime)'};
  let dt='';
  for(const[k,v] of Object.entries(policy.defense)){
    dt+=`<div class="row"><span>${names[k]}</span><label class="toggle"><input type="checkbox" ${v?'checked':''} onchange="toggleDefense('${k}')"><span class="slider"></span></label></div>`;
  }
  document.getElementById('defense-toggles').innerHTML=dt;
  // Stats
  let bl=0,al=0;
  policy.audit.forEach(a=>{if(a.result==='DENY')bl++;else al++;});
  document.getElementById('stat-blocked').textContent=bl;
  document.getElementById('stat-allowed').textContent=al;
  // Domain lists
  document.getElementById('domain-blacklist').innerHTML=policy.domainBL.map(d=>`<span class="tag tag-block" onclick="removeItem('domainBL','${d}')">${d} ✕</span>`).join('');
  document.getElementById('domain-whitelist').innerHTML=policy.domainWL.map(d=>`<span class="tag tag-allow" onclick="removeItem('domainWL','${d}')">${d} ✕</span>`).join('');
  document.getElementById('ip-blacklist').innerHTML=policy.ipBL.map(d=>`<span class="tag tag-block" onclick="removeItem('ipBL','${d}')">${d}* ✕</span>`).join('');
  document.getElementById('path-blacklist').innerHTML=policy.pathBL.map(d=>`<span class="tag tag-block" onclick="removeItem('pathBL','${d}')">${d} ✕</span>`).join('');
  document.getElementById('env-patterns').innerHTML=policy.envPatterns.map(d=>`<span class="tag tag-block" onclick="removeItem('envPatterns','${d}')">${d} ✕</span>`).join('');
  // Tools
  let tl='';
  policy.tools.forEach(t=>{tl+=`<div class="row"><span>${t.id} — ${t.desc}</span><span class="tag ${t.status==='blocked'?'tag-block':'tag-allow'}">${t.status}</span></div>`;});
  document.getElementById('tool-list').innerHTML=tl;
  document.getElementById('tool-blacklist').innerHTML=policy.toolBL.map(d=>`<span class="tag tag-block" onclick="removeItem('toolBL','${d}')">${d} ✕</span>`).join('');
  // Audit
  let alog='';
  policy.audit.forEach(a=>{let cls=a.result==='DENY'?'log-block':'log-allow';alog+=`<div class="log-line ${cls}"><strong>${a.time}</strong> ${a.tool} · ${a.action} · <span style="color:${a.result==='DENY'?'var(--red)':'var(--green)'}">${a.result}</span> — ${a.reason}</div>`;});
  document.getElementById('audit-log').innerHTML=alog;
}
function switchTab(t){document.querySelectorAll('main').forEach(m=>m.style.display='none');document.getElementById(t).style.display='block';document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));event.target.classList.add('active');}
function toggleDefense(k){policy.defense[k]=!policy.defense[k];policy.preset='custom';save();}
function addItem(type){
  const map={ 'domain-bl':{arr:'domainBL',input:'new-domain-bl'},'domain-wl':{arr:'domainWL',input:'new-domain-wl'},'ip-bl':{arr:'ipBL',input:'new-ip-bl'},'path-bl':{arr:'pathBL',input:'new-path-bl'},'env-pattern':{arr:'envPatterns',input:'new-env-pattern'},'tool-bl':{arr:'toolBL',input:'new-tool-bl'} };
  const m=map[type]; if(!m)return;
  const inp=document.getElementById(m.input);
  const val=inp.value.trim();
  if(val && !policy[m.arr].includes(val)){ policy[m.arr].push(val); policy.preset='custom'; inp.value=''; save(); }
}
function removeItem(arr,val){ policy[arr]=policy[arr].filter(v=>v!==val); policy.preset='custom'; save(); }
function applyPreset(){
  const v=document.getElementById('preset-select').value;
  if(v==='standard'){policy=JSON.parse(JSON.stringify(defaultPolicy));policy.preset='standard';}
  else if(v==='strict'){policy=JSON.parse(JSON.stringify(defaultPolicy));policy.preset='strict';policy.defense={layer1:true,layer2:true,layer3:true,layer4:true,layer5:false};policy.domainBL.push('*');policy.domainWL=[];}
  else if(v==='permissive'){policy=JSON.parse(JSON.stringify(defaultPolicy));policy.preset='permissive';policy.defense.layer5=false;policy.domainBL=['192.168.*','10.*','172.16.*'];policy.pathBL=['/etc/passwd','/etc/shadow'];}
  else{policy.preset='custom';}
  save();
}
function exportPolicy(){
  const yml = [
    '# AegisRun Policy Configuration',
    '# Generated: '+new Date().toISOString(),
    '# Preset: '+policy.preset,
    '',
    'blacklist:',
    '  network:',
    ...policy.domainBL.map(d=>'    - "'+d+'"'),
    '  filesystem:',
    ...policy.pathBL.map(p=>'    - "'+p+'"'),
    '  env_vars:',
    ...policy.envPatterns.map(e=>'    - "'+e+'"'),
    '  ip_ranges:',
    ...policy.ipBL.map(i=>'    - "'+i+'*"'),
    '',
    'whitelist:',
    '  network:',
    ...policy.domainWL.map(d=>'    - "'+d+'"'),
  ].join('\n');
  const blob = new Blob([yml],{type:'text/yaml'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'policy.yaml';
  a.click();
  alert('Exported: policy.yaml\n\nSave to D:\\moonbit\\aegisrun\\policy.yaml\nthen run: moon run src/main preset file');
}
function exportCLI(){
  // Generate AEGISRUN_POLICY env var (fast, single-line)
  const parts = [];
  if(policy.domainBL.length) parts.push('domain_bl='+policy.domainBL.join(','));
  if(policy.domainWL.length) parts.push('domain_wl='+policy.domainWL.join(','));
  if(policy.pathBL.length) parts.push('path_bl='+policy.pathBL.join(','));
  if(policy.envPatterns.length) parts.push('env_bl='+policy.envPatterns.join(','));
  if(policy.toolBL.length) parts.push('tool_bl='+policy.toolBL.join(','));
  const policyStr = parts.join('|');

  const cmds = [];
  cmds.push('# AegisRun - Apply web panel settings');
  cmds.push('# 1. Copy the line below and paste in CMD:');
  cmds.push('');
  cmds.push('set AEGISRUN_POLICY='+policyStr);
  cmds.push('moon run src/main show');
  cmds.push('');
  cmds.push('# 2. Or one-liner:');
  cmds.push('cmd /c "set AEGISRUN_POLICY='+policyStr+' && moon run src/main show"');
  cmds.push('');
  cmds.push('# 3. Test with intercept demo:');
  cmds.push('cmd /c "set AEGISRUN_POLICY='+policyStr+' && set AEGISRUN_ATTACKS=all && moon run src/generator/intercept.mbt"');
  const txt = cmds.join('\n');
  navigator.clipboard.writeText(txt).then(()=>alert('CLI commands copied!\n\nPaste in CMD.\nSettings sync to AegisRun library via AEGISRUN_POLICY env var.'));
}
function fetchStats(){
  fetch('/api/stats').then(r=>r.json()).then(d=>{
    document.getElementById('stat-status').textContent = d.status;
    document.getElementById('stat-uptime').textContent = d.uptime;
  }).catch(()=>{});
}
setInterval(fetchStats, 2000);  // 每2秒刷新
fetchStats();
render();
</script>
</body>
</html>
