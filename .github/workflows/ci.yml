name: CI

on:
  push:
    branches: [master, main, clean-v2]
  pull_request:
    branches: [master, main, clean-v2]

jobs:
  moonbit-checks:
    name: MoonBit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        uses: moonbitlang/setup-moonbit@v1
        with:
          moon-version: "0.10.3"

      - name: Info (generate .mbti)
        run: moon info

      - name: Format check
        run: moon fmt --check

      - name: Compile check
        run: moon check

      - name: Test
        run: moon test

      - name: Strict: Info diff
        run: moon info && git diff --exit-code -- '*.mbti'
        continue-on-error: true

      - name: Strict: Format diff
        run: moon fmt && git diff --exit-code
        continue-on-error: true

      - name: Strict: Check deny-warn
        run: moon check --deny-warn
        continue-on-error: true

  rust-checks:
    name: Rust Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test
