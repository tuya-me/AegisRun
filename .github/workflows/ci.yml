name: CI

on:
  push:
    branches: [master, main, clean-v2]
  workflow_dispatch:
  pull_request:
    branches: [master, main, clean-v2]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  moonbit:
    name: MoonBit (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit CLI
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show MoonBit version
        run: moon version

      - name: Update registry index
        run: moon update

      - name: Check diagnostics
        run: moon check --target ${{ matrix.target }}

      - name: Run tests
        run: moon test --target ${{ matrix.target }}

  release-gates:
    name: Release gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit CLI
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update registry index
        run: moon update

      - name: Check diagnostics
        run: moon check

      - name: Run tests
        run: moon test

  rust-checks:
    name: Rust Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test
