name: Set up MoonBit
description: Install MoonBit toolchain (composite action, runs on repo)

inputs:
  moon-version:
    description: MoonBit toolchain version
    required: false
    default: "0.1.20260703"

runs:
  using: composite
  steps:
    - name: Install MoonBit (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        version="${{ inputs.moon-version }}"
        echo "Installing MoonBit $version"
        curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s "$version"
        echo "$HOME/.moon/bin" >> $GITHUB_PATH
        moon version --all

    - name: Install MoonBit (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $version = "${{ inputs.moon-version }}"
        Write-Host "Installing MoonBit $version"
        $env:MOONBIT_INSTALL_VERSION = $version
        Invoke-RestMethod https://cli.moonbitlang.com/install/powershell.ps1 | Invoke-Expression
        "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        moon version --all
