# ================================================
# AegisRun — Permissive Security Preset
# "Light touch, dev environments"
# Use for: local development, fully trusted tools
# ================================================

blacklist:
  network:
    domains:
      - "192.168.*"         # Still block local network
      - "10.*"
      - "172.16.*"
  filesystem:
    paths:
      - "/etc/passwd"       # Still block absolute critical files
      - "/etc/shadow"
      - "~/.ssh/id_rsa*"
      - "~/.aws/credentials"
      - "C:\\Windows\\System32\\*"
  env_vars:
    - "AWS_SECRET_ACCESS_KEY"  # Still block key secrets
    - "OPENAI_API_KEY"
    - "ANTHROPIC_API_KEY"
  tool_ids: []

whitelist:
  network:
    domains:
      - "*"                 # All external domains OK
  filesystem:
    paths:
      - "~/*"               # All user files OK
  tool_ids: []
  authors: []

defaults:
  auto_grant:
    timeout_ms: 120000      # 2 minutes
    memory_kb: 524288       # 512 MB
  require_manual_approval: []  # Nothing needs manual approval

concurrency:
  max_total_calls: 200
  max_per_tool: 20
  max_per_session: 10
  queue_size: 500
  queue_timeout_ms: 120000
